[package]
name = "confi-desktop"
version = "0.1.0"
description = "CONFI desktop application"
authors = ["CONFI"]
edition = "2024"

[lib]
# Suffix keeps the lib name distinct from the bin name on Windows.
name = "confi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The shared processing engine. Rendering (PDFium) stays off for now: this slice
# covers detection and the operations that need no native library.
confi-core = { path = "../../../core" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
