[package]
name = "confi-core"
version.workspace = true
edition.workspace = true
description = "CONFI shared processing engine — file detection, image operations, PDF operations"
publish = false

[lib]
name = "confi_core"
crate-type = ["lib"]

[dependencies]
# Serialization
serde = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Utilities
uuid = { workspace = true }

# File type detection via magic bytes (MIT)
infer = "0.16"

# Image processing — pure Rust, MIT/Apache
# Features explicitly listed to keep binary size controlled
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "bmp",
    "rayon",
] }

# PNG lossless optimization (MIT)
oxipng = { version = "9", default-features = false, features = ["filetime"] }

# WebP lossy encoding via libwebp bindings (Apache-2.0)
# Optional: the `image` crate can decode WebP but has limited lossy encode quality control.
# This crate wraps libwebp and supports quality-controlled lossy encode.
# Feature-gated until the PoC confirms it cross-compiles to Android arm64.
webp = { version = "0.3", optional = true }

# PDF engine — lopdf (MIT). Committed for merge/split/rotate as of M3.
# Structural operations only. Rendering is a separate module (see below).
lopdf = "0.34"

# PDF rendering — pdfium-render (MIT bindings) around PDFium (BSD-3, prebuilt
# binary vendored under vendor/pdfium). Feature-gated so the structural engine
# never depends on a native library. Dynamic binding: the DLL/so is loaded at
# runtime, nothing is linked at build time.
pdfium-render = { version = "0.9.5", optional = true }

[features]
default = []
# Enable lossy WebP encoding via libwebp
webp-encode = ["dep:webp"]
# Enable PDF rasterisation (page previews, thumbnails, PDF-to-image)
render = ["dep:pdfium-render"]

[[example]]
name = "render_poc"
required-features = ["render"]

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"
serde_json = { workspace = true }
